<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | GateTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { heading: ['"Outfit"', 'sans-serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { corporate: { 900: '#060A14', brand: '#2563EB' } }
                }
            }
        }
    </script>
    <style>
        .bg-dots-dark { background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 24px 24px; }
    </style>
</head>
<body class="font-sans antialiased bg-corporate-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Background Effects -->
    <div class="absolute inset-0 bg-dots-dark opacity-40"></div>
    <div class="absolute top-1/4 left-1/4 w-[400px] h-[400px] bg-blue-600/20 blur-[100px] rounded-full mix-blend-screen pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md px-6">
        <!-- Logo -->
        <div class="flex justify-center mb-10">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-corporate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <span class="font-heading font-extrabold text-2xl tracking-tight text-white">GateTech.</span>
            </a>
        </div>

        <!-- Login Card -->
        <div class="bg-gray-900/60 backdrop-blur-xl border border-gray-800 p-8 rounded-2xl shadow-2xl">
            <h2 class="font-heading text-2xl font-bold mb-2">Portal Akses</h2>
            <p class="text-gray-400 text-sm font-light mb-8">Masuk ke dashboard manajemen gedung Anda.</p>
            
            <form class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Korporat</label>
                    <input type="email" class="w-full bg-gray-950 border border-gray-800 text-white text-sm rounded-lg focus:ring-1 focus:ring-corporate-brand focus:border-corporate-brand block p-3 outline-none transition-all" placeholder="admin@gedung.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Kata Sandi</label>
                    <input type="password" class="w-full bg-gray-950 border border-gray-800 text-white text-sm rounded-lg focus:ring-1 focus:ring-corporate-brand focus:border-corporate-brand block p-3 outline-none transition-all" placeholder="••••••••">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="rounded bg-gray-900 border-gray-700 text-corporate-brand focus:ring-corporate-brand">
                        <span class="text-xs text-gray-400">Ingat sesi ini</span>
                    </label>
                    <a href="#" class="text-xs text-corporate-brand hover:text-blue-400">Lupa sandi?</a>
                </div>
                <button type="button" class="w-full bg-white text-corporate-900 font-bold py-3.5 rounded-lg hover:bg-gray-200 transition-colors mt-4">
                    Autentikasi Sistem
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-gray-600 mt-8 font-light">
            Dilindungi oleh enkripsi 256-bit. Hubungi tim support jika Anda kehilangan akses.
        </p>
    </div>
</body>
</html>
