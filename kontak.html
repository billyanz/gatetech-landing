<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Kami | GateTech Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/config.js"></script>
</head>
<body class="font-sans antialiased text-gray-800 bg-gray-50">

    <!-- NAVBAR (Sama kayak di atas, aktifin class di menu Kontak) -->
    <!-- ... -->

    <section class="py-20">
        <div class="max-w-4xl mx-auto px-4">
            <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden flex flex-col md:flex-row">
                <!-- Info Kontak Kiri -->
                <div class="md:w-5/12 bg-corporate-900 text-white p-10">
                    <h2 class="text-2xl font-bold mb-6">Konsultasi Enterprise</h2>
                    <p class="text-gray-400 mb-8 text-sm">Diskusikan kebutuhan manajemen gedung Anda bersama tim engineer kami.</p>
                    
                    <div class="space-y-6">
                        <div>
                            <p class="text-sm text-gray-500">Email Perusahaan</p>
                            <p class="font-medium">enterprise@gatetech.id</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">Kantor Pusat</p>
                            <p class="font-medium">Menara Nusantara Lt. 8, Jakarta Selatan</p>
                        </div>
                    </div>
                </div>
                
                <!-- Form Kanan -->
                <div class="md:w-7/12 p-10">
                    <h3 class="text-xl font-bold text-corporate-900 mb-6">Jadwalkan Demo Sistem</h3>
                    <form class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Lengkap</label>
                                <input type="text" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-corporate-brand focus:border-corporate-brand outline-none" placeholder="Budi Santoso">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Gedung/Perusahaan</label>
                                <input type="text" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-corporate-brand focus:border-corporate-brand outline-none" placeholder="PT Manajemen Aset">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Email Kerja</label>
                            <input type="email" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-corporate-brand focus:border-corporate-brand outline-none" placeholder="budi@perusahaan.com">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Kebutuhan Integrasi</label>
                            <select class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-corporate-brand focus:border-corporate-brand outline-none bg-white">
                                <option>Visitor Management Saja</option>
                                <option>Visitor Management + Parkir</option>
                                <option>Full Sistem Lobi & Turnstile</option>
                            </select>
                        </div>
                        <a href="index.html"
                        class="w-full bg-corporate-brand text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition mt-4 block text-center">Kirim Permintaan Demo</a>
                    </form>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
